[package]
name = "fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Standalone workspace: the enclosing root workspace does not list this
# package as a member, and without this table cargo refuses to build from
# inside fuzz/ ("current package believes it's in a workspace").
[workspace]

[dependencies]
libfuzzer-sys = "0.4"

[[bin]]
name = "fuzz_main"
path = "fuzz_targets/fuzz_main.rs"
test = false
doc = false
