[workspace]
resolver = "2"
members = [
    "crates/rpa-core",
    "crates/rpa-config",
    "crates/rpa-events",
    "crates/rpa-plugin",
    "crates/rpa-resources",
    "crates/rpa-scheduler",
    "crates/rpa-state",
    "crates/rpa-fs-workflow",
]

[package]
name = "rpa-elysium"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "RPA Elysium - Comprehensive test suite for filesystem automation"

[[bench]]
name = "rpa_benchmarks"
harness = false

# Dev-dependencies for the root bench target (benches/rpa_benchmarks.rs).
# Without these the CI `cargo check --all-targets` gate fails to compile
# the bench (unresolved criterion / rpa_core / rpa_plugin / serde_json).
[dev-dependencies]
criterion = { workspace = true }
rpa-core = { path = "crates/rpa-core" }
rpa-plugin = { path = "crates/rpa-plugin" }
serde_json = { workspace = true }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"  # MPL-2.0 fallback available for ecosystem compatibility
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
repository = "https://github.com/hyperpolymath/rpa-elysium"

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Filesystem watching
notify = "6.1"
notify-debouncer-mini = "0.4"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Configuration (Nickel integration via JSON bridge)
nickel-lang-core = "0.8"

# Async utilities
async-trait = "0.1"
futures = "0.3"

# File operations
walkdir = "2.4"
glob = "0.3"
flate2 = "1.0"
tar = "0.4"
zip = "0.6"
chrono = { version = "0.4", features = ["serde"] }

# Plugin system (WASM sandbox)
# `profiling` (a wasmtime default feature) is deliberately disabled: it is the
# only path pulling `fxprof-processed-profile` -> `fxhash`, which is
# unmaintained (RUSTSEC-2025-0057) and fails `cargo audit --deny unmaintained`.
# The plugin sandbox uses core-Wasm runtime + fuel metering only, so the
# guest-profiler machinery is dead weight here.
wasmtime = { version = "36.0.8", default-features = false, features = [
    "cranelift",
    "runtime",
    "std",
    "wat",
] }
wit-bindgen = "0.36"
uuid = { version = "1.6", features = ["v4", "serde"] }

# Testing
tempfile = "3.10"
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }
