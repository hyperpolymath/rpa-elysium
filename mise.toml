# Minimal Rust development environment; ABI/site tools are installed only when used.
[tools]
# Estate environment policy provisions Bun first, even in Rust workspaces.
bun = "1.4.2"
rust = "stable"

[tasks.build]
run = "cargo build --locked --workspace"
[tasks.test]
run = "cargo test --locked --workspace --all-targets"
[tasks.lint]
run = "cargo clippy --locked --workspace --all-targets -- -D warnings"
[tasks.fmt]
run = "cargo fmt --all -- --check"
[tasks.ci-check]
run = "just ci-check"
