name: ClusterFuzzLite Batch
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'
permissions:
  contents: read
jobs:
  BatchFuzzing:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          sanitizer: ${{ matrix.sanitizer }}
          language: rust
      - uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 1800
          sanitizer: ${{ matrix.sanitizer }}
          mode: batch
          output-sarif: true
      - uses: github/codeql-action/upload-sarif@v4.38.1
        # ClusterFuzzLite only emits vulnerabilities.sarif when there are
        # findings; uploading unconditionally failed clean runs with
        # "Path does not exist".
        if: always() && hashFiles('vulnerabilities.sarif') != ''
        with:
          sarif_file: vulnerabilities.sarif
