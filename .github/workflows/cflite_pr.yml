# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
name: ClusterFuzzLite PR
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.rs'
permissions:
  contents: read
jobs:
  PR:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          sanitizer: ${{ matrix.sanitizer }}
          language: rust
      - uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          sanitizer: ${{ matrix.sanitizer }}
          mode: code-change
          output-sarif: true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        # ClusterFuzzLite only emits vulnerabilities.sarif when there are
        # findings; uploading unconditionally failed clean runs with
        # "Path does not exist".
        if: always() && hashFiles('vulnerabilities.sarif') != ''
        with:
          sarif_file: vulnerabilities.sarif
