# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# Prevention workflow - validates all workflows have proper security config
name: Workflow Security Linter
on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    # Weekly, after the Monday cargo-audit run: a workflow can go red without a
    # push (the ClusterFuzzLite batch is on a Sunday schedule), and a red that
    # nobody pushes near would otherwise go unrecorded until the next commit.
    - cron: '30 6 * * 1'
permissions:
  contents: read
  # Reading the run list is what lets the ledger verify recorded states against
  # the latest runs on the default branch.
  actions: read
jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check SPDX headers
        run: |
          errors=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            if ! head -1 "$f" | grep -q "SPDX-License-Identifier"; then
              echo "ERROR: $f missing SPDX header"
              errors=$((errors + 1))
            fi
          done
          exit $errors
      - name: Check permissions declaration
        run: |
          errors=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            if ! grep -q "^permissions:" "$f"; then
              echo "ERROR: $f missing permissions declaration"
              errors=$((errors + 1))
            fi
          done
          exit $errors
      - name: Verify immutable direct and transitive action graph
        run: bash scripts/check-lock-sync.sh
      - name: Check community health and standards baseline
        run: |
          bash scripts/check-repository-health.sh
          bash scripts/tests/repository-health-test.sh
      - name: Verify the CI check ledger
        # Offline structure always; the recorded states are verified against the
        # latest runs on the default branch, where a green workflow that has
        # gone red must not pass unnoticed (docs/CI-RED-DETERMINATIONS.adoc).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/ci-check-ledger.sh --check
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            echo "pull request: recorded states are verified on the default branch"
          else
            bash scripts/ci-check-ledger.sh --verify
          fi
