# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# Prevention workflow - audits Rust dependencies for vulnerabilities.
#
# The audit steps are blocking and unchanged in meaning. What changed is what
# happens to the issue: previously every failing run created a duplicate whose
# whole body was "Run `cargo audit` locally for details", and nothing ever
# closed one. Now one issue carries the findings, the run that produced them and
# acceptance criteria, and the gate that opened it closes it again with a green
# run on the default branch (scripts/reconcile-audit-issue.sh).
name: Cargo Audit
on:
  push:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  schedule:
    - cron: '0 6 * * 1' # Weekly on Monday
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Run cargo audit
        id: audit
        # Both audits run so the report shows unmaintained crates as well as
        # advisories; the step still fails if either fails.
        run: |
          status=0
          {
            echo '--- cargo audit --deny warnings ---'
            cargo audit --deny warnings 2>&1 || status=$?
            echo '--- cargo audit --deny unmaintained ---'
            cargo audit --deny unmaintained 2>&1 || status=$?
          } | tee "$RUNNER_TEMP/cargo-audit.txt"
          exit "$status"
      - name: Reconcile the vulnerability issue
        # Runs whatever the audit did, so a passing audit closes the issue it
        # opened. Skipped on pull requests (including forks) and when the audit
        # never ran, because an install failure is not a vulnerability finding.
        if: always() && github.event_name != 'pull_request' && steps.audit.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDIT_STATUS: ${{ steps.audit.outcome == 'success' && '0' || '1' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash scripts/reconcile-audit-issue.sh \
            --status "$AUDIT_STATUS" \
            --summary "$RUNNER_TEMP/cargo-audit.txt" \
            --run "$RUN_URL" \
            --event "${{ github.event_name }}" \
            --repo "${{ github.repository }}"
