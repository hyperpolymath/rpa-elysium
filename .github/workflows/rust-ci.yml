# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# Rust CI — thin wrapper calling the shared estate reusable in
# hyperpolymath/standards. Configure once, propagate everywhere.
# See: docs/CI-REUSABLE-WORKFLOWS.adoc in standards.
name: Rust CI
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  actions: read
  contents: read
jobs:
  rust-ci:
    uses: hyperpolymath/standards/.github/workflows/rust-ci-reusable.yml@84355587cb2a1f86e6882de83514a32db2646e7a
  clippy-diagnostics:
    name: Rust failure diagnostics
    needs: rust-ci
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Match the shared stable toolchain
        run: rustup default stable
      - name: Publish compiler diagnostics as annotations
        run: bash scripts/annotate-clippy.sh
