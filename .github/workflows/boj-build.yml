# SPDX-License-Identifier: MPL-2.0
name: BoJ Server Build Trigger
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trigger-boj:
    # Opt-in: public runners cannot reach the old unauthenticated .local service.
    if: vars.BOJ_BUILD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Monitor build-service egress
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: ${{ vars.BOJ_BUILD_ALLOWED_ENDPOINTS }}
      - name: Trigger the configured build service securely
        env:
          BUILD_URL: ${{ vars.BOJ_BUILD_URL }}
          BUILD_TOKEN: ${{ secrets.BOJ_BUILD_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$BUILD_URL" == https://* ]] || { echo '::error::BOJ_BUILD_URL must use HTTPS'; exit 1; }
          [[ -n "$BUILD_TOKEN" ]] || { echo '::error::BOJ_BUILD_TOKEN is required'; exit 1; }
          payload=$(jq -n --arg repo "$REPOSITORY" --arg branch "$REF_NAME" \
            '{repo:$repo, branch:$branch, engine:"casket"}')
          curl --fail --silent --show-error --max-time 30 --output /dev/null \
            -H "Authorization: Bearer $BUILD_TOKEN" -H 'Content-Type: application/json' \
            --data "$payload" "$BUILD_URL"
