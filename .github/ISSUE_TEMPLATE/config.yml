#
# Issue chooser configuration. Blank issues stay enabled so that reports which
# fit neither form are not silently discouraged.
blank_issues_enabled: true
contact_links:
  - name: Security vulnerability
    url: https://github.com/hyperpolymath/rpa-elysium/security/advisories/new
    about: Report privately via a security advisory. Do NOT open a public issue.
  - name: Question or support request
    url: https://github.com/hyperpolymath/rpa-elysium/discussions
    about: Ask a question. See .github/SUPPORT.md for what to expect.
